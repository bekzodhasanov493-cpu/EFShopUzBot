<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF SHOP UZ — To‘lov</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #17212b;
            padding: 18px;
        }

        .container {
            max-width: 430px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            color: #6b7280;
            margin-top: 6px;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .value-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 16px;
        }

        .value {
            font-size: 17px;
            font-weight: 700;
            word-break: break-all;
        }

        .copy-btn {
            border: none;
            background: #e5e7eb;
            border-radius: 9px;
            padding: 8px 11px;
            cursor: pointer;
            font-size: 15px;
        }

        .amount {
            text-align: center;
            background: #eef6ff;
            border-radius: 14px;
            padding: 15px;
            margin: 5px 0 18px;
        }

        .amount-title {
            font-size: 13px;
            color: #6b7280;
        }

        .amount-value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 4px;
        }

        .timer {
            text-align: center;
            font-size: 15px;
            margin-bottom: 18px;
            color: #d97706;
            font-weight: 600;
        }

        .main-btn {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .paid {
            background: #22c55e;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .notice {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.5;
            margin-top: 15px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            background: #17212b;
            color: white;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">💳</div>

        <div class="title">
            EF SHOP UZ
        </div>

        <div class="subtitle">
            E’lon uchun to‘lov
        </div>
    </div>


    <div class="card">

        <div class="label">
            💳 Karta raqami
        </div>

        <div class="value-box">

            <div class="value" id="cardNumber">
                8600 0000 0000 0000
            </div>

            <button class="copy-btn" onclick="copyCard()">
                📋
            </button>

        </div>


        <div class="label">
            👤 Karta egasi
        </div>

        <div class="value-box">

            <div class="value">
                EF SHOP UZ
            </div>

        </div>


        <div class="amount">

            <div class="amount-title">
                💰 To‘lanadigan summa
            </div>

            <div class="amount-value">
                5 000 so‘m
            </div>

        </div>


        <div class="timer">
            ⏱ To‘lov uchun qolgan vaqt:
            <span id="timer">05:00</span>
        </div>


        <button class="main-btn paid" onclick="paymentDone()">
            ✅ To‘lov qildim
        </button>

        <button class="main-btn cancel" onclick="cancelPayment()">
            ❌ Bekor qilish
        </button>

    </div>


    <div class="notice">
        To‘lovni amalga oshirgandan so‘ng
        <b>“To‘lov qildim”</b> tugmasini bosing.
        <br>
        E’loningiz admin tomonidan tekshiriladi.
    </div>

</div>


<div class="toast" id="toast">
    Karta raqami nusxalandi ✅
</div>


<script>

    // =========================
    // KARTA NUSXALASH
    // =========================

    function copyCard() {

        const card = document.getElementById("cardNumber").innerText;

        navigator.clipboard.writeText(card);

        const toast = document.getElementById("toast");

        toast.style.display = "block";

        setTimeout(function() {
            toast.style.display = "none";
        }, 1800);
    }


    // =========================
    // 5 DAQIQALIK TIMER
    // =========================

    let time = 5 * 60;

    const timerElement = document.getElementById("timer");

    const countdown = setInterval(function() {

        let minutes = Math.floor(time / 60);
        let seconds = time % 60;

        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");

        timerElement.innerText =
            minutes + ":" + seconds;

        if (time <= 0) {

            clearInterval(countdown);

            timerElement.innerText = "00:00";

        }

        time--;

    }, 1000);


    // =========================
    // TO‘LOV QILDIM
    // =========================

    function paymentDone() {

        alert(
            "To‘lov tasdiqlash uchun yuboriladi."
        );

    }


    // =========================
    // BEKOR QILISH
    // =========================

    function cancelPayment() {

        if (
            window.Telegram &&
            Telegram.WebApp
        ) {
            Telegram.WebApp.close();
        }

    }

</script>

</body>
</html>
